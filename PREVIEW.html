<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview InStrategic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 900;
        }
        p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.125rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }
        .features {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            text-align: left;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        .feature strong {
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
        }
        .feature span {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>?? InStrategic v2.0</h1>
        <p>Platform analisis saham Indonesia dengan UI/UX expert level 2025</p>
        <a href="index.html" class="btn">Buka Website ?</a>
        
        <div class="features">
            <div class="feature">
                <strong>? Zero Encoding Errors</strong>
                <span>Tidak ada tanda "?" lagi</span>
            </div>
            <div class="feature">
                <strong>? World-Class Design</strong>
                <span>Inspired by Linear & Vercel</span>
            </div>
            <div class="feature">
                <strong>? Real-time Data</strong>
                <span>Yahoo Finance API</span>
            </div>
            <div class="feature">
                <strong>? Dark/Light Mode</strong>
                <span>Smooth transitions</span>
            </div>
        </div>
    </div>
</body>
</html>
